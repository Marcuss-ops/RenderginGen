worker:
  id: renderinggen-77
  # Pipeline (CPU/I/O) workers stay ahead of the GPU stages; the Vulkan B2 deep
  # ring (Chronon kSubmissionRingDepth=6) removed the per-batch drain stall.
  pipeline_workers: 3
  # 2 lanes is the measured ceiling, NOT the deep ring: see
  # infra/native/renderinggen-native.yaml (extra lanes add queue wait, VRAM
  # pressure and text-path lock contention without raising the render-loop
  # rate) and the daemon's serialized execution domain
  # (Chronon3d/apps/chronon3d_cli/daemon/daemon_render_concurrency.hpp).
  # Keep PipelineGen's RENDERINGGEN_GPU_SLOTS equal to this value — the shipped
  # systemd drop-in is scripts/systemd/pipelinegen.service.d/gpu-slots.conf.
  gpu_lanes: 2

queue:
  endpoint: https://queue.pipelinegen.example

artifact_store:
  endpoint: https://storage.pipelinegen.example
  local_cache_dir: /var/lib/renderinggen/cache
  # Cache budgets. These used to be compile-time constants in the worker wiring;
  # rebalance them for the host (more RAM -> raise l1_max_bytes, more NVMe ->
  # raise l2_max_bytes). 0 means unbounded.
  l1_max_bytes: 268435456 # 256 MiB small-object RAM cache
  l2_max_bytes: 10737418240 # 10 GiB NVMe cache

# DB artifact ledger (optional): every rendered job writes one ArtifactRecord
# (hash, probe facts, semantic counters, per-phase metrics) to a local SQLite
# file after the object store accepts the bytes. Empty path disables it.
# artifact_db:
#   path: /var/lib/renderinggen/artifacts.db

# Prefer tmpfs on GPU workers; the worker falls back to persistent storage
# when /dev/shm is unavailable.
workspace:
  root: ""

chronon:
  profile: gpu-vulkan-native
  home: /opt/chronon3d
  binary: /opt/chronon3d/bin/chronon3d_cli
  # Warm render shell: render through the persistent Chronon daemon started
  # by worker-entrypoint.sh (caches alive across jobs).
  mode: ipc
  socket_path: /var/run/chronon3d/chronon.sock
  encode_preset: p1
  pipe_pixfmt: nv12
  # Abort a render that produced no output at all for this long. The legacy
  # CHRONON_STALL_TIMEOUT variable is still honored as an alias of this setting.
  stall_timeout: 3m

# External certification tools (probe, closed-GOP scan, decode/visibility
# check). Point these at a pinned build instead of relying on PATH.
media:
  ffprobe_binary: ffprobe
  ffmpeg_binary: ffmpeg

# Pipeline timings. Every value below is a deployment fact: a host with a slow
# object store wants a longer claim_retry_delay, a host with large workspaces
# wants a shorter workspace_sweep_interval. 0 (or omitting the key) keeps the
# shipped default shown in the comments.
pipeline:
  claim_long_poll: 25s # long-poll window of the queue claim
  claim_retry_delay: 5s # pause after a failed claim
  heartbeat_interval: 20s # queue liveness heartbeat
  degraded_after_failures: 3 # consecutive heartbeat failures -> /health degraded
  workspace_sweep_interval: 10m # how often crashed-run workspaces are reaped
  workspace_stale_after: 1h # age without a valid lease marker before sweeping
  workspace_lease_refresh: 10m # GPU lane refreshes the liveness marker this often
  # Must stay comfortably above workspace_lease_refresh: config rejects a TTL
  # that does not outlive the refresh, because that would let the sweeper remove
  # a live render's workspace between two refreshes.
  workspace_lease_ttl: 2h
  lease_renew_attempts: 3 # renewal retries per tick before aborting the job
  lease_renew_backoff: 2s # first retry delay (doubles, capped at lease/2)
  # Output-verification policy the worker requests from Chronon and enforces
  # from its receipt: "" (fast, the default) | fast | normal | certify.
  # config rejects any other spelling at load: silently running fast because of
  # a typo would mean an operator asked for proof and did not get it.
  receipt_verify: ""
  # Sampled ffmpeg visual gate for jobs whose plan carries an authored overlay.
  # Off by default: it costs an extra decode of the finished output.
  deep_visual_validation: false
  # Leave a finished job's workspace on disk for inspection. Off by default —
  # the jobs root is often tmpfs (RAM), so this is a deliberate debugging aid.
  keep_workspace: false

gpu:
  device: 0

health:
  addr: ":8080"
