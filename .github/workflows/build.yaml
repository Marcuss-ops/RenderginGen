name: build

# Runs on every push to main (and manually).
# Images are published with immutable, versioned tags only — never `latest`.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      certification:
        description: "Run the GPU runtime certification suite (needs a self-hosted GPU runner)"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/marcuss-ops
  # Chronon3d runtime image tag, published by the Marcuss-ops/Chronon3d repo.
  # RenderingGen does not build Chronon; it consumes this pinned image.
  CHRONON_RUNTIME_VERSION: "0.1.0"

jobs:
  test-renderinggen:
    name: Build & test renderinggen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: renderinggen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt -w on the files above"; exit 1; }
      - run: go build ./...
      - run: go vet ./...
      # -race is not optional here: the renderer's Progress callback is invoked
      # from BOTH of its output-streaming goroutines and the worker records that
      # observation on the job, so an unsynchronised write is a shipped data
      # race that a plain `go test` cannot see. -count=1 keeps a cached PASS
      # from hiding it.
      #
      # The architecture gate is excluded on purpose (and runs in the next
      # step): it is a pure file scanner, so race instrumentation buys nothing
      # there and only slows its regexp pass down by minutes. Every package that
      # actually executes concurrent code is still instrumented.
      #
      # RENDERINGGEN_SKIP_GPU_E2E=1 disables the real-engine runtime
      # certification suite explicitly. It is already absent from this
      # checkout, but "the binary happens to be missing" is not a contract: a
      # unit job must never turn into real renders because someone later added
      # a Chronon checkout to the workspace.
      - run: RENDERINGGEN_SKIP_GPU_E2E=1 go test -race -count=1 $(go list ./... | grep -v '/internal/architecture$')
      - run: go test -count=1 ./internal/architecture/...

  test-queue:
    name: Build & test queue
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: queue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt -w on the files above"; exit 1; }
      - run: go build ./...
      - run: go vet ./...
      # The claim/lease paths are the queue's concurrency surface: a race here
      # means two workers can own one job.
      - run: RENDERINGGEN_SKIP_GPU_E2E=1 go test -race -count=1 ./...

  test-objectstore:
    name: Build & test objectstore
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: objectstore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt -w on the files above"; exit 1; }
      - run: go build ./...
      - run: go vet ./...
      - run: RENDERINGGEN_SKIP_GPU_E2E=1 go test -race -count=1 ./...

  publish-worker:
    name: Publish renderinggen-worker
    runs-on: ubuntu-latest
    needs: test-renderinggen
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Read versions
        run: |
          echo "VERSION=$(cat renderinggen/VERSION)" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/renderinggen-worker.Dockerfile
          push: true
          build-args: |
            CHRONON_RUNTIME=${{ env.IMAGE_BASE }}/chronon3d-runtime:${{ env.CHRONON_RUNTIME_VERSION }}
            VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE_BASE }}/renderinggen-worker:${{ env.VERSION }}
            ${{ env.IMAGE_BASE }}/renderinggen-worker:sha-${{ env.SHORT_SHA }}

  publish-queue:
    name: Publish queue
    runs-on: ubuntu-latest
    needs: test-queue
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Read versions
        run: |
          echo "VERSION=$(cat queue/VERSION)" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: queue/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/queue:${{ env.VERSION }}
            ${{ env.IMAGE_BASE }}/queue:sha-${{ env.SHORT_SHA }}

  publish-objectstore:
    name: Publish objectstore
    runs-on: ubuntu-latest
    needs: test-objectstore
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Read versions
        run: |
          echo "VERSION=$(cat objectstore/VERSION)" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: objectstore/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/objectstore:${{ env.VERSION }}
            ${{ env.IMAGE_BASE }}/objectstore:sha-${{ env.SHORT_SHA }}

  # ═══════════════════════════════════════════════════════════════════════
  # Runtime certification — MANUAL, on a self-hosted GPU runner.
  #
  # The certification suite (internal/overlay: real chronon3d_cli renders, then
  # decoded and pixel-compared against the software reference) is the strongest
  # assertion in this repository. It cannot run on GitHub-hosted runners — it
  # needs a GPU, a built chronon3d_cli and ffmpeg — so the unit jobs disable it
  # explicitly with RENDERINGGEN_SKIP_GPU_E2E=1, which left the suite with no
  # owner at all: it ran only where a developer happened to have an engine.
  #
  # This job is that owner. It is manual (dispatch it, or set the repo variable
  # below and wire it to a schedule) and it deliberately does NOT set the
  # skip variable, so the certification actually renders. Configure the
  # repository variable CHRONON_BIN to the absolute path of a built
  # chronon3d_cli on the runner; the job fails loudly if it is unset rather
  # than reporting a green run in which every test skipped.
  #
  #   gh workflow run build -f certification=true
  runtime-certification:
    name: Runtime certification (GPU)
    if: github.event_name == 'workflow_dispatch' && inputs.certification
    runs-on: [self-hosted, gpu]
    defaults:
      run:
        working-directory: renderinggen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Certification suite (real engine)
        env:
          CHRONON_BIN: ${{ vars.CHRONON_BIN }}
        run: |
          test -n "$CHRONON_BIN" || {
            echo "set the CHRONON_BIN repository variable to a built chronon3d_cli on this runner" >&2
            exit 1
          }
          test -x "$CHRONON_BIN" || {
            echo "CHRONON_BIN=$CHRONON_BIN is not executable on this runner" >&2
            exit 1
          }
          go test -count=1 -timeout 30m -v ./internal/overlay/ \
            -run 'TestFinal_|TestGoal3|TestRenderingGen2Chronon'

  # ═══════════════════════════════════════════════════════════════════════
  # Golden canary — permanent end-to-end gate.
  #
  # Boots postgres + objectstore from the production infra compose and adds
  # Queue + RenderingGen through the CI-only compose overlay. The worker keeps
  # the real Chronon IPC daemon warm but selects the software backend because
  # GitHub-hosted runners expose no production NVIDIA device.
  golden-e2e:
    name: Golden canary E2E
    runs-on: ubuntu-latest
    needs: [test-renderinggen, test-queue, test-objectstore]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve chronon3d-runtime image
        run: |
          RUNTIME="ghcr.io/marcuss-ops/chronon3d-runtime:${{ env.CHRONON_RUNTIME_VERSION }}"
          if docker manifest inspect "$RUNTIME" >/dev/null 2>&1; then
            echo "Using published runtime image: $RUNTIME"
          else
            echo "Published runtime image not reachable; building from Chronon3d source"
            git clone --depth 1 https://github.com/Marcuss-ops/Chronon3d.git /tmp/chronon3d
            docker build -f /tmp/chronon3d/docker/chronon-runtime/Dockerfile \
              -t "$RUNTIME" /tmp/chronon3d
          fi

      - name: Boot the E2E stack
        run: |
          cd infra/docker
          docker compose -f docker-compose.yaml -f docker-compose.ci.yaml up -d --build

      - name: Wait for queue readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8081/health >/dev/null 2>&1; then
              echo "queue ready"
              exit 0
            fi
            sleep 2
          done
          echo "queue did not become ready" >&2
          exit 1

      - name: Run the golden canary
        run: infra/e2e/run-golden-overlay.sh

      - name: Tear down
        if: always()
        run: |
          cd infra/docker
          docker compose -f docker-compose.yaml -f docker-compose.ci.yaml down -v
