name: build

# Runs on every push to main (and manually).
# Images are published with immutable, versioned tags only — never `latest`.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/marcuss-ops
  # Chronon3d runtime image tag, published by the Marcuss-ops/Chronon3d repo.
  # RenderingGen does not build Chronon; it consumes this pinned image.
  CHRONON_RUNTIME_VERSION: "0.1.0"

jobs:
  test-renderinggen:
    name: Build & test renderinggen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: renderinggen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  test-queue:
    name: Build & test queue
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: queue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  test-objectstore:
    name: Build & test objectstore
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: objectstore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  publish-worker:
    name: Publish renderinggen-worker
    runs-on: ubuntu-latest
    needs: test-renderinggen
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Read versions
        run: |
          echo "VERSION=$(cat renderinggen/VERSION)" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/renderinggen-worker.Dockerfile
          push: true
          build-args: |
            CHRONON_RUNTIME=${{ env.IMAGE_BASE }}/chronon3d-runtime:${{ env.CHRONON_RUNTIME_VERSION }}
            VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE_BASE }}/renderinggen-worker:${{ env.VERSION }}
            ${{ env.IMAGE_BASE }}/renderinggen-worker:sha-${{ env.SHORT_SHA }}

  publish-queue:
    name: Publish queue
    runs-on: ubuntu-latest
    needs: test-queue
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Read versions
        run: |
          echo "VERSION=$(cat queue/VERSION)" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: queue/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/queue:${{ env.VERSION }}
            ${{ env.IMAGE_BASE }}/queue:sha-${{ env.SHORT_SHA }}

  publish-objectstore:
    name: Publish objectstore
    runs-on: ubuntu-latest
    needs: test-objectstore
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Read versions
        run: |
          echo "VERSION=$(cat objectstore/VERSION)" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: objectstore/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/objectstore:${{ env.VERSION }}
            ${{ env.IMAGE_BASE }}/objectstore:sha-${{ env.SHORT_SHA }}

  # ═══════════════════════════════════════════════════════════════════════
  # Golden canary — permanent end-to-end gate.
  #
  # Boots postgres + objectstore from the production infra compose and adds
  # Queue + RenderingGen through the CI-only compose overlay. The worker keeps
  # the real Chronon IPC daemon warm but selects the software backend because
  # GitHub-hosted runners expose no production NVIDIA device.
  golden-e2e:
    name: Golden canary E2E
    runs-on: ubuntu-latest
    needs: [test-renderinggen, test-queue, test-objectstore]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve chronon3d-runtime image
        run: |
          RUNTIME="ghcr.io/marcuss-ops/chronon3d-runtime:${{ env.CHRONON_RUNTIME_VERSION }}"
          if docker manifest inspect "$RUNTIME" >/dev/null 2>&1; then
            echo "Using published runtime image: $RUNTIME"
          else
            echo "Published runtime image not reachable; building from Chronon3d source"
            git clone --depth 1 https://github.com/Marcuss-ops/Chronon3d.git /tmp/chronon3d
            docker build -f /tmp/chronon3d/docker/chronon-runtime/Dockerfile \
              -t "$RUNTIME" /tmp/chronon3d
          fi

      - name: Boot the E2E stack
        run: |
          cd infra/docker
          docker compose -f docker-compose.yaml -f docker-compose.ci.yaml up -d --build

      - name: Wait for queue readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8081/health >/dev/null 2>&1; then
              echo "queue ready"
              exit 0
            fi
            sleep 2
          done
          echo "queue did not become ready" >&2
          exit 1

      - name: Run the golden canary
        run: infra/e2e/run-golden-overlay.sh

      - name: Tear down
        if: always()
        run: |
          cd infra/docker
          docker compose -f docker-compose.yaml -f docker-compose.ci.yaml down -v
