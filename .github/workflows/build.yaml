name: build

# Runs on every push to main (and manually).
# Images are published with immutable, versioned tags only — never `latest`.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/marcuss-ops

jobs:
  test-renderinggen:
    name: Build & test renderinggen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: renderinggen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  test-queue:
    name: Build & test queue
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: queue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  test-objectstore:
    name: Build & test objectstore
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: objectstore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  publish-chronon:
    name: Publish chronon-gpu-runtime
    runs-on: ubuntu-latest
    needs: [test-renderinggen, test-queue, test-objectstore]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Read versions
        run: |
          echo "VERSION=$(cat chronon/VERSION)" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/chronon-gpu-runtime.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/chronon-gpu-runtime:${{ env.VERSION }}
            ${{ env.IMAGE_BASE }}/chronon-gpu-runtime:sha-${{ env.SHORT_SHA }}

  publish-worker:
    name: Publish renderinggen-worker
    runs-on: ubuntu-latest
    needs: publish-chronon
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Read versions
        run: |
          echo "CHRONON_VERSION=$(cat chronon/VERSION)" >> "$GITHUB_ENV"
          echo "VERSION=$(cat renderinggen/VERSION)" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/renderinggen-worker.Dockerfile
          push: true
          build-args: |
            CHRONON_RUNTIME=${{ env.IMAGE_BASE }}/chronon-gpu-runtime:${{ env.CHRONON_VERSION }}
            VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE_BASE }}/renderinggen-worker:${{ env.VERSION }}
            ${{ env.IMAGE_BASE }}/renderinggen-worker:sha-${{ env.SHORT_SHA }}

  publish-queue:
    name: Publish queue
    runs-on: ubuntu-latest
    needs: test-queue
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Read versions
        run: |
          echo "VERSION=$(cat queue/VERSION)" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: queue/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/queue:${{ env.VERSION }}
            ${{ env.IMAGE_BASE }}/queue:sha-${{ env.SHORT_SHA }}

  publish-objectstore:
    name: Publish objectstore
    runs-on: ubuntu-latest
    needs: test-objectstore
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Read versions
        run: |
          echo "VERSION=$(cat objectstore/VERSION)" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: objectstore/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/objectstore:${{ env.VERSION }}
            ${{ env.IMAGE_BASE }}/objectstore:sha-${{ env.SHORT_SHA }}
