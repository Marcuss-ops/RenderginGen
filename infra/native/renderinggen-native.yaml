worker:
  id: renderinggen-local
  pipeline_workers: 3
  # Match PipelineGen's certified RENDERINGGEN_GPU_SLOTS=3 admission contract.
  # The daemon serializes GPU execution; these lanes keep CPU prep/post work
  # pipelined without claiming extra daemon execution capacity. If
  # p50(renderinggen_worker_lane_wait_seconds) ever dominates p50(render),
  # add a daemon socket to chronon.socket_paths or lower gpu_lanes — raising
  # gpu_lanes against one daemon only grows the wait.
  gpu_lanes: 3
queue:
  endpoint: http://127.0.0.1:8081
artifact_store:
  endpoint: http://127.0.0.1:9000
  local_cache_dir: /var/lib/renderinggen/cache
workspace:
  root: /dev/shm/renderinggen/jobs
chronon:
  profile: gpu-vulkan-native
  home: /usr/local
  binary: /usr/local/bin/chronon3d_cli
  mode: ipc
  socket_path: /run/chronon3d/chronon.sock
  strict_native_backend: true
  encode_preset: p1
  pipe_pixfmt: nv12
gpu:
  device: 0
health:
  addr: 127.0.0.1:8080
