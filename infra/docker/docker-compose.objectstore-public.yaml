services:
  objectstore:
    ports:
      # 443 is owned by the host Nginx TLS terminator. Keep the object store's
      # TLS listener local-only; Nginx proxies /objects/ to the plain HTTP
      # listener on 127.0.0.1:9000.
      - "127.0.0.1:9443:9443"
    env_file:
      - /etc/pipelinegen/objectstore.env
    environment:
      OBJECTSTORE_TLS_ADDR: ":9443"
      OBJECTSTORE_TLS_CERT_FILE: /etc/letsencrypt/live/77.93.152.122/fullchain.pem
      OBJECTSTORE_TLS_KEY_FILE: /etc/letsencrypt/live/77.93.152.122/privkey.pem
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
