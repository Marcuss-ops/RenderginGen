services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: renderinggen
      POSTGRES_USER: renderinggen
      POSTGRES_PASSWORD: renderinggen
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renderinggen -d renderinggen"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  queue:
    build:
      context: ../..
      dockerfile: queue/Dockerfile
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://renderinggen:renderinggen@postgres:5432/renderinggen?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  objectstore:
    build:
      context: ../..
      dockerfile: objectstore/Dockerfile
    ports:
      - "9000:9000"
    volumes:
      - objectstore-data:/var/lib/objectstore
    restart: unless-stopped

  worker:
    # CHRONON_RUNTIME is built from the real Chronon3d repo (not vendored
    # here); see README "Build & run" for the two-step local build.
    build:
      context: ../..
      dockerfile: infra/docker/renderinggen-worker.Dockerfile
      args:
        CHRONON_RUNTIME: ghcr.io/marcuss-ops/chronon3d-runtime:0.1.0
        VERSION: 0.1.0
    environment:
      CHRONON_HOME: /opt/chronon3d
      CHRONON_EXTERNAL_DAEMON: "1"
    tmpfs:
      - /dev/shm:size=4g,mode=1777
    shm_size: 4g
    volumes:
      - renderinggen-cache:/var/lib/renderinggen/cache
      - /run/chronon3d/chronon.sock:/var/run/chronon3d/chronon.sock
      - /tmp/renderinggen/jobs:/tmp/renderinggen/jobs
      - ./worker-config-drive.yaml:/etc/renderinggen/config.yaml:ro
      - ./credentials.json:/etc/renderinggen/credentials.json:ro
      - ./token.json:/etc/renderinggen/token.json
    depends_on:
      - queue
      - objectstore
    # Vulkan GPU passthrough; adjust for your provider.
    # devices:
    #   - /dev/dri:/dev/dri
    restart: unless-stopped

  # Second worker with a distinct worker id. Used to exercise concurrent
  # claim/render across two real workers (Test 11): the atomic claim
  # (FOR UPDATE SKIP LOCKED) must never hand the same job to both.
  worker-b:
    image: docker-worker
    environment:
      CHRONON_HOME: /opt/chronon3d
      CHRONON_EXTERNAL_DAEMON: "1"
    tmpfs:
      - /dev/shm:size=4g,mode=1777
    shm_size: 4g
    volumes:
      - renderinggen-cache:/var/lib/renderinggen/cache
      - /run/chronon3d/chronon.sock:/var/run/chronon3d/chronon.sock
      - /tmp/renderinggen/jobs:/tmp/renderinggen/jobs
      - ./worker-config-b.yaml:/etc/renderinggen/config.yaml:ro
    depends_on:
      - queue
      - objectstore
    restart: unless-stopped

volumes:
  renderinggen-cache:
  objectstore-data:
  postgres-data:
