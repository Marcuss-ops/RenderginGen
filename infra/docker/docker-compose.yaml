services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: renderinggen
      POSTGRES_USER: renderinggen
      POSTGRES_PASSWORD: renderinggen
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renderinggen -d renderinggen"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  queue:
    build:
      context: ../..
      dockerfile: queue/Dockerfile
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://renderinggen:renderinggen@postgres:5432/renderinggen?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  objectstore:
    build:
      context: ../..
      dockerfile: objectstore/Dockerfile
    ports:
      - "9000:9000"
    volumes:
      - objectstore-data:/var/lib/objectstore
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/renderinggen-worker.Dockerfile
      args:
        CHRONON_RUNTIME: chronon-gpu-runtime:0.9.4
        VERSION: 0.1.0
    environment:
      CHRONON_HOME: /opt/chronon
    volumes:
      - renderinggen-cache:/var/lib/renderinggen/cache
      - ./worker-config.yaml:/etc/renderinggen/config.yaml:ro
    depends_on:
      - queue
      - objectstore
    # Vulkan GPU passthrough; adjust for your provider.
    # devices:
    #   - /dev/dri:/dev/dri
    restart: unless-stopped

volumes:
  renderinggen-cache:
  objectstore-data:
  postgres-data:
