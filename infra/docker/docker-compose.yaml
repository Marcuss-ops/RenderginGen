services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: renderinggen
      POSTGRES_USER: renderinggen
      POSTGRES_PASSWORD: renderinggen
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renderinggen -d renderinggen"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  objectstore:
    build:
      context: ../..
      dockerfile: objectstore/Dockerfile
    ports:
      - "9000:9000"
    volumes:
      - objectstore-data:/var/lib/objectstore
    restart: unless-stopped

volumes:
  objectstore-data:
  postgres-data:
