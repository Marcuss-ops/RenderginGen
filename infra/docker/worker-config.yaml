worker:
  id: renderinggen-local

queue:
  endpoint: http://queue:8081

artifact_store:
  endpoint: http://objectstore:9000
  local_cache_dir: /var/lib/renderinggen/cache

# Prefer tmpfs on GPU workers; the worker falls back to persistent storage
# when /dev/shm is unavailable.
workspace:
  root: /dev/shm/renderinggen/jobs

chronon:
  profile: gpu-vulkan-native
  home: /opt/chronon3d
  # Warm render shell: the worker renders through the persistent Chronon
  # daemon started by worker-entrypoint.sh (caches alive across jobs).
  mode: ipc
  socket_path: /var/run/chronon3d/chronon.sock

gpu:
  device: 0

health:
  addr: ":8080"
