# AUGRENDER-02 — explicit VRAM budget for the single Chronon daemon.
#
# Install as
#   /etc/systemd/system/chronon3d.service.d/30-vram-budget.conf
# then `systemctl daemon-reload && systemctl restart chronon3d.service`
# in a maintenance window (restarting the daemon drops an in-flight render).
#
# The RTX A4000 has 16.384 MiB. The hard cap leaves ~4 GiB for the CUDA
# context, Ollama and the desktop; the soft cap is the early-warning point
# reported by vma_usage_bytes / vma_budget_bytes in the timing sidecar.
# Chronon checks the cap BEFORE vmaCreateImage, so an over-budget allocation
# fails with a named hard-budget error instead of VkResult=-2.
#
# Rollback: remove this file, daemon-reload and restart.
[Service]
Environment=CHRONON_VRAM_HARD_LIMIT_MB=12288
Environment=CHRONON_VRAM_SOFT_LIMIT_MB=10240
