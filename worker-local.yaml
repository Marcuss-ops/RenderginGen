worker:
  id: renderinggen-host

queue:
  endpoint: http://localhost:8081

artifact_store:
  endpoint: http://localhost:9000
  local_cache_dir: /tmp/renderinggen/cache

workspace:
  root: /tmp/renderinggen/jobs

chronon:
  backend: vulkan
  mode: cli
  hardware_encoder: nvenc
  strict_native_backend: true
  report: true
  # Canonical install prefix (see README); override per host instead of
  # committing a developer-specific build directory.
  home: /opt/chronon3d

gpu:
  device: 0

health:
  addr: ":8085"

drive:
  enabled: true
  mode: oauth
  # Repo-relative so the local profile carries no machine-specific path.
  credentials_file: infra/docker/credentials.json
  token_file: infra/docker/token.json
  parent_folder_id: 1ST6FxPuRaxwBOIz39MAN8Jj4gDv509-K
